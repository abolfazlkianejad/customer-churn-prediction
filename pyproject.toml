[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartpredict"
version = "0.1.0"
description = "Production-oriented customer churn prediction system."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["machine-learning", "churn-prediction", "xgboost", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "xgboost>=2.1",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "shap>=0.46",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.5",
  "PyYAML>=6.0",
  "uvicorn>=0.30",
  "optuna>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]
# D203/D213 are mutually exclusive with D211/D212; prefer the PEP 257 form.

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
packages = ["smartpredict"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "joblib.*",
  "matplotlib.*",
  "pandas.*",
  "seaborn.*",
  "shap.*",
  "sklearn.*",
  "uvicorn.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["smartpredict"]

[tool.coverage.report]
show_missing = true
