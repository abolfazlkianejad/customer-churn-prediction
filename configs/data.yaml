# Data pipeline configuration for the IBM Telco Customer Churn dataset.
# Consumed by the data layer (to be implemented in the next phase).

dataset:
  name: ibm_telco_customer_churn
  raw_path: data/raw/telco_customer_churn.csv
  format: csv
  target_column: Churn
  positive_label: "Yes"
  negative_label: "No"

identity:
  id_column: customerID
  drop_id_in_model: true

split:
  strategy: stratified
  stratify_column: Churn
  train: 0.70
  validation: 0.15
  test: 0.15
  seed: 42

expected_columns:
  - customerID
  - gender
  - SeniorCitizen
  - Partner
  - Dependents
  - tenure
  - PhoneService
  - MultipleLines
  - InternetService
  - OnlineSecurity
  - OnlineBackup
  - DeviceProtection
  - TechSupport
  - StreamingTV
  - StreamingMovies
  - Contract
  - PaperlessBilling
  - PaymentMethod
  - MonthlyCharges
  - TotalCharges
  - Churn

column_types:
  numeric:
    - SeniorCitizen
    - tenure
    - MonthlyCharges
    - TotalCharges
  categorical:
    - gender
    - Partner
    - Dependents
    - PhoneService
    - MultipleLines
    - InternetService
    - OnlineSecurity
    - OnlineBackup
    - DeviceProtection
    - TechSupport
    - StreamingTV
    - StreamingMovies
    - Contract
    - PaperlessBilling
    - PaymentMethod

validation:
  numeric_ranges:
    tenure: [0, 72]
    MonthlyCharges: [0, 150]
    TotalCharges: [0, 10000]
  allowed_categories:
    gender: [Female, Male]
    SeniorCitizen: [0, 1]
    Partner: ["Yes", "No"]
    Dependents: ["Yes", "No"]
    PhoneService: ["Yes", "No"]
    MultipleLines: ["Yes", "No", "No phone service"]
    InternetService: [DSL, Fiber optic, "No"]
    OnlineSecurity: ["Yes", "No", "No internet service"]
    OnlineBackup: ["Yes", "No", "No internet service"]
    DeviceProtection: ["Yes", "No", "No internet service"]
    TechSupport: ["Yes", "No", "No internet service"]
    StreamingTV: ["Yes", "No", "No internet service"]
    StreamingMovies: ["Yes", "No", "No internet service"]
    Contract: ["Month-to-month", "One year", "Two year"]
    PaperlessBilling: ["Yes", "No"]
    PaymentMethod:
      - Electronic check
      - Mailed check
      - "Bank transfer (automatic)"
      - "Credit card (automatic)"
